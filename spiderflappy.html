<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spider-Flappy</title>

    <link rel="icon" type="image/png" href="spider-art.png">

    <link rel="stylesheet" href="spiderflappy.css">

</head>

<body>

    <div id="game-container">

        <header id="game-header">

            <a id="back-button" href="juegos.html">

                ← Volver

            </a>

            <h1>

                Spider-Flappy

            </h1>

        </header>


        <div id="score-container">

            <span>Puntuación</span>

            <h2 id="score">

                0

            </h2>

        </div>


        <canvas id="game-canvas" width="400" height="650"></canvas>


        <div id="start-screen">

            <h2>

                Spider-Flappy

            </h2>

            <p>

                Pulsa ESPACIO o toca la pantalla para empezar.

            </p>

        </div>


        <div id="game-over" style="display:none;">

            <h2>

                GAME OVER

            </h2>

            <p>

                Puntuación:
                <span id="final-score">

                    0

                </span>

            </p>

            <button id="restart-button">

                Jugar otra vez

            </button>

            <a href="juegos.html">

                Volver a Juegos

            </a>

        </div>

    </div>

    <script src="spiderflappy.js"></script>

</body>

</html>
